<div id="cookieModal" class="cookie-modal">
  <div class="cookie-modal-content">

    <h3 class="mb-2">We use cookies</h3>

    <p class="text-muted">
      We use essential cookies to make our site work. We’d also like to set optional
      analytics and functional cookies to help us improve your experience.
      You can accept all cookies, reject non‑essential cookies, or customise your choices.
    </p>

    <div class="cookie-options mt-3">
      <label class="d-block mb-2">
        <input type="checkbox" id="cookieFunctional">
        Allow functional cookies
      </label>

      <label class="d-block mb-2">
        <input type="checkbox" id="cookieAnalytics">
        Allow analytics cookies
      </label>
    </div>

    <div class="cookie-buttons mt-3 d-flex gap-2">
      <button id="cookieAcceptAll" class="btn btn-primary">Accept all</button>
      <button id="cookieEssentialOnly" class="btn btn-secondary">Essential only</button>
      <a href="/cookie-policy/" class="btn btn-outline-dark">Settings</a>
      <button id="cookieSave" class="btn btn-outline-primary">Save</button>
    </div>

  </div>
</div>
