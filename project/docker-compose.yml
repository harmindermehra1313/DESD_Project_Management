# Harminder EDITS
services:

  db:
    image: postgres:15-alpine
    container_name: brfn_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brfn}
      POSTGRES_USER: ${POSTGRES_USER:-brfn_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brfn_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5   

  web:
    build: .
    container_name: brfn_app
    command: ["./wait-for-db.sh"]
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  camunda:
    image: camunda/camunda-bpm-platform:run-latest
    container_name: camunda
    environment:
      - TZ=Europe/London
    ports:
      - "8100:8080" # Must be port 8080 do not change

  adminer:
    image: adminer:latest
    container_name: brfn_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

