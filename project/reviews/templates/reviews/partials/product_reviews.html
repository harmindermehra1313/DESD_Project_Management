<section class="product-reviews-panel mt-4"
         aria-labelledby="productReviewsTitle">
    <div class="product-reviews-header">
        <div>
            <div class="product-reviews-kicker">Verified customer feedback</div>
            <h2 id="productReviewsTitle" class="h4 mb-1">Customer reviews</h2>
            <p id="productReviewsSummary" class="text-muted mb-0">Loading reviews...</p>
        </div>
        <div id="productReviewsMeta"
             class="product-reviews-meta d-none"
             aria-hidden="true">
            <div id="productReviewsAverage" class="product-reviews-average">0.0</div>
            <div class="product-reviews-meta-label">Average rating</div>
        </div>
    </div>
    <div id="productReviewsBreakdown" class="product-review-breakdown d-none"></div>
    <div id="productReviewsList" class="d-grid gap-3 mt-3"></div>
</section>
