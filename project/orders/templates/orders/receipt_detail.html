{% extends "base.html" %}
{% load static %}
{% block content %}
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h2 class="mb-1">Receipt</h2>
                <p class="text-muted mb-0">View and download the receipt for this completed order.</p>
            </div>
            <div class="d-flex gap-2">
                <a href="{% url 'orders:order-history-page' %}"
                   class="btn btn-outline-secondary">Back</a>
                <button type="button" id="downloadReceiptBtn" class="btn btn-dark">Download</button>
            </div>
        </div>
        <div id="receiptLoading" class="text-muted">Loading receipt...</div>
        <div id="receiptError" class="alert alert-danger d-none" role="alert"></div>
        <div id="receiptContent" class="d-none">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white">
                    <strong>Receipt Summary</strong>
                </div>
                <div class="card-body" id="receiptSummary"></div>
            </div>
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white">
                    <strong>Items</strong>
                </div>
                <div class="card-body" id="receiptItems"></div>
            </div>
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white">
                    <strong>Fulfilment Details</strong>
                </div>
                <div class="card-body" id="receiptFulfilment"></div>
            </div>
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <strong>Totals</strong>
                </div>
                <div class="card-body" id="receiptTotals"></div>
            </div>
        </div>
    </div>
{% endblock %}
{% block scripts %}
    {{ block.super }}
    <script>window.RECEIPT_ORDER_ID = "{{ order_id }}";</script>
    <script src="{% static 'orders/receipt_detail.js' %}"></script>
{% endblock %}
