{% extends 'base.html' %}
{% load static %}

{% block title %}
Products | BRFN
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/products.css' %}">
<style>
    .product-card img { height: 140px; object-fit: cover; }
    .filter-box { background:#f8f9fa; padding:20px; border-radius:8px; border:1px solid #e1e1e1; }
</style>
{% endblock %}

{% block content %}
<div class="container my-5">

    <h1 class="mb-4">
        {% if selected_category %}{{ selected_category.name }}{% else %}All Products{% endif %}
    </h1>

    <!-- FILTER BAR -->
    <div class="filter-box mb-5">
        <div class="row g-3">

            <div class="col-md-4">
                <input id="searchInput" type="text" class="form-control" placeholder="Search products...">
            </div>

            <div class="col-md-2">
                <input id="minPrice" type="number" class="form-control" placeholder="Min price">
            </div>

            <div class="col-md-2">
                <input id="maxPrice" type="number" class="form-control" placeholder="Max price">
            </div>

            <div class="col-md-3">
                <select id="sortSelect" class="form-select">
                    <option value="">Sort by</option>
                    <option value="price_low">Price: Low → High</option>
                    <option value="price_high">Price: High → Low</option>
                    <option value="newest">Newest</option>
                </select>
            </div>

            <div class="col-md-1">
                <button id="applyFilters" class="btn btn-brand-solid w-100">Go</button>
            </div>

        </div>
    </div>

    <!-- PRODUCT GRID -->
    <div id="productGrid" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-4"></div>

</div>

<script>
    const products = JSON.parse(`{{ products_json|escapejs }}`);

    function renderProducts(list) {
        const grid = document.getElementById("productGrid");
        grid.innerHTML = "";

        if (list.length === 0) {
            grid.innerHTML = "<p class='text-muted'>No products found.</p>";
            return;
        }

        list.forEach(p => {
            grid.innerHTML += `
                <div class="col">
                    <div class="card h-100 product-card">
                        <div class="card-header bg-white text-center fw-bold border-0 pt-3">
                            ${p.name}
                        </div>

                        <img src="${p.image}" class="card-img-top" alt="${p.name}">

                        <div class="card-body d-flex flex-column">
                            <p class="text-muted small mb-2">By: ${p.producer}</p>
                            <p class="card-text small mb-3">${p.description.substring(0, 60)}...</p>

                            <h5 class="fw-bold mb-3">£${p.price}</h5>

                            <a href="/products/${p.id}/" class="btn btn-brand-outline w-100 mb-2">
                                More Information
                            </a>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    function applyFilters() {
        let list = [...products];

        const search = document.getElementById("searchInput").value.toLowerCase();
        const minPrice = parseFloat(document.getElementById("minPrice").value);
        const maxPrice = parseFloat(document.getElementById("maxPrice").value);
        const sort = document.getElementById("sortSelect").value;

        if (search) {
            list = list.filter(p =>
                p.name.toLowerCase().includes(search) ||
                p.description.toLowerCase().includes(search)
            );
        }

        if (!isNaN(minPrice)) list = list.filter(p => p.price >= minPrice);
        if (!isNaN(maxPrice)) list = list.filter(p => p.price <= maxPrice);

        if (sort === "price_low") list.sort((a, b) => a.price - b.price);
        if (sort === "price_high") list.sort((a, b) => b.price - a.price);
        if (sort === "newest") list.sort((a, b) => b.id - a.id);

        renderProducts(list);
    }

    document.getElementById("applyFilters").addEventListener("click", applyFilters);

    renderProducts(products);
</script>

{% endblock %}
