{% extends "base.html" %}
{% block title %}My Profile{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px; border-radius: 10px;">
        <div class="card-body text-center p-5">
            
            <h2 class="mb-3" style="color: var(--brand); font-weight: bold;">
                Hello, {{ user.name }}!
            </h2>
            
            <p class="text-muted mb-4">Welcome to your account profile.</p>

            {% if user.role == 'PRODUCER' %}
                <div class="mt-4 p-4" style="background-color: #fbfbfb; border-radius: 8px; border: 1px solid #e9ecef;">
                    <h5 class="mb-3">Producer Tools</h5>
                    <a href="{% url 'accounts:producer_dashboard' %}" class="btn btn-primary px-4 py-2">
                        Go to Producer Dashboard
                    </a>
                </div>
            {% endif %}

        </div>
    </div>
</div>
{% endblock %}
